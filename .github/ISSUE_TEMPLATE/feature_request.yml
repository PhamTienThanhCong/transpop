name: Feature request
description: Suggest an idea or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      placeholder: "When I read PDFs, I'd like to…"
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How should it work? Mock-ups welcome.
  - type: checkboxes
    id: scope
    attributes:
      label: Scope
      options:
        - label: This doesn't require new browser permissions (or I explain why it's worth it)
