<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="TransPop">
  <title>TransPop</title>
  <!--
    TransPop — master app icon (MIT). "A selected word inside a speech bubble":
    the highlight bar with text-selection handles = what you select,
    the speech bubble = the translation that pops up.
    Small sizes use simplified sources in store-assets/src/ (icon-16.svg, icon-32.svg).
  -->
  <defs>
    <linearGradient id="transpop-bg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="transpop-gloss" cx="30" cy="10" r="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".22"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="transpop-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur stdDeviation="3.5"/>
    </filter>
    <path id="transpop-bubble" d="M40 20h48c13.3 0 24 10.7 24 24v26c0 13.3-10.7 24-24 24H56c-7 8-16 13.5-26.5 15.6-1.5.3-2.5-1.3-1.5-2.5 3.6-4.3 5.8-8.5 6.9-14.1C23.6 91 16 81.2 16 70V44c0-13.3 10.7-24 24-24z"/>
  </defs>

  <!-- squircle background + soft top-left gloss -->
  <path fill="url(#transpop-bg)" d="M64 0C118 0 128 10 128 64S118 128 64 128 0 118 0 64 10 0 64 0Z"/>
  <path fill="url(#transpop-gloss)" d="M64 0C118 0 128 10 128 64S118 128 64 128 0 118 0 64 10 0 64 0Z"/>

  <!-- speech bubble (with soft shadow) -->
  <use href="#transpop-bubble" fill="#312E81" opacity=".28" transform="translate(0 4)" filter="url(#transpop-shadow)"/>
  <use href="#transpop-bubble" fill="#FFFFFF"/>

  <!-- selected text: highlight + selection handles -->
  <g fill="url(#transpop-bg)">
    <rect x="36" y="46" width="56" height="22"/>
    <circle cx="36" cy="37" r="6.5"/>
    <circle cx="92" cy="77" r="6.5"/>
  </g>
  <path fill="none" stroke="url(#transpop-bg)" stroke-width="5" stroke-linecap="round" d="M36 40v32M92 42v32"/>
</svg>
