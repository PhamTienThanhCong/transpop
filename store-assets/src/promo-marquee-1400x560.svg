<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="560" viewBox="0 0 1400 560">
  <!-- TransPop — Chrome Web Store marquee promo tile (1400×560). Render: bash store-assets/render.sh -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1400" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="128" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow" cx="260" cy="60" r="700" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow-win" x="-20%" y="-20%" width="140%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dy="18" result="b"/>
      <feFlood flood-color="#1E1B4B" flood-opacity=".40"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow-bubble" x="-30%" y="-30%" width="160%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="16"/>
      <feOffset dy="12" result="b"/>
      <feFlood flood-color="#0F172A" flood-opacity=".22"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow-logo" x="-40%" y="-40%" width="180%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dy="8" result="b"/>
      <feFlood flood-color="#1E1B4B" flood-opacity=".35"/>
      <feComposite in2="b" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- logo mark (same geometry as extension/icons/logo-mark.svg) -->
    <g id="mark">
      <path fill="url(#lg)" d="M64 0C118 0 128 10 128 64S118 128 64 128 0 118 0 64 10 0 64 0Z"/>
      <path fill="#FFFFFF" d="M40 20h48c13.3 0 24 10.7 24 24v26c0 13.3-10.7 24-24 24H56c-7 8-16 13.5-26.5 15.6-1.5.3-2.5-1.3-1.5-2.5 3.6-4.3 5.8-8.5 6.9-14.1C23.6 91 16 81.2 16 70V44c0-13.3 10.7-24 24-24z"/>
      <g fill="url(#lg)">
        <rect x="36" y="46" width="56" height="22"/>
        <circle cx="36" cy="37" r="7"/>
        <circle cx="92" cy="77" r="7"/>
      </g>
      <path fill="none" stroke="url(#lg)" stroke-width="6" stroke-linecap="round" d="M36 40v32M92 42v32"/>
    </g>
  </defs>

  <!-- background -->
  <rect width="1400" height="560" fill="url(#bg)"/>
  <rect width="1400" height="560" fill="url(#glow)"/>
  <circle cx="40" cy="600" r="260" fill="#FFFFFF" opacity=".05"/>
  <circle cx="660" cy="-60" r="160" fill="#FFFFFF" opacity=".05"/>

  <!-- left: brand -->
  <g transform="translate(110 102)" filter="url(#shadow-logo)">
    <path fill="none" stroke="#FFFFFF" stroke-opacity=".5" stroke-width="5" d="M64 0C118 0 128 10 128 64S118 128 64 128 0 118 0 64 10 0 64 0Z" transform="scale(.9375)"/>
    <use href="#mark" transform="scale(.9375)"/>
  </g>
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" fill="#FFFFFF">
    <text x="104" y="318" font-size="104" font-weight="700" letter-spacing="-3">TransPop</text>
    <text x="110" y="374" font-size="34" font-weight="500">Select to translate — instantly</text>
  </g>
  <!-- feature pills -->
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" text-anchor="middle">
    <rect x="110" y="414" width="166" height="40" rx="20" fill="#FFFFFF" fill-opacity=".16" stroke="#FFFFFF" stroke-opacity=".28"/>
    <text x="193" y="440">130+ languages</text>
    <rect x="288" y="414" width="236" height="40" rx="20" fill="#FFFFFF" fill-opacity=".16" stroke="#FFFFFF" stroke-opacity=".28"/>
    <text x="406" y="440">Dictionary &amp; pronunciation</text>
    <rect x="536" y="414" width="128" height="40" rx="20" fill="#FFFFFF" fill-opacity=".16" stroke="#FFFFFF" stroke-opacity=".28"/>
    <text x="600" y="440">Open source</text>
  </g>

  <!-- right: browser window mock (bleeds off the right/bottom edges) -->
  <g filter="url(#shadow-win)">
    <rect x="740" y="70" width="720" height="560" rx="18" fill="#FFFFFF"/>
  </g>
  <path d="M758 70h702v48H740v-30a18 18 0 0 1 18-18z" fill="#F1F3F8"/>
  <line x1="740" y1="118" x2="1400" y2="118" stroke="#E5E7EF"/>
  <circle cx="766" cy="94" r="6.5" fill="#F87171"/>
  <circle cx="788" cy="94" r="6.5" fill="#FBBF24"/>
  <circle cx="810" cy="94" r="6.5" fill="#4ADE80"/>
  <rect x="840" y="81" width="420" height="26" rx="13" fill="#FFFFFF" stroke="#E5E7EF"/>
  <text x="860" y="99" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="#94A3B8">example.com/articles/learning-languages</text>
  <!-- toolbar icon -->
  <g transform="translate(1282 82) scale(.1875)"><use href="#mark"/></g>

  <!-- article skeleton -->
  <rect x="784" y="152" width="420" height="22" rx="11" fill="#CBD5E1"/>
  <rect x="784" y="186" width="250" height="12" rx="6" fill="#E2E8F0"/>
  <rect x="784" y="222" width="580" height="11" rx="5.5" fill="#E8ECF3"/>
  <rect x="784" y="244" width="540" height="11" rx="5.5" fill="#E8ECF3"/>

  <!-- the sentence with the selected word -->
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="21" fill="#334155">
    <text x="784" y="290">The answer was</text>
    <rect x="947" y="270" width="86" height="28" rx="4" fill="#C7D2FE"/>
    <text x="990" y="290" text-anchor="middle" fill="#1E1B4B">obvious</text>
    <g fill="#4F46E5">
      <rect x="944.5" y="265" width="3" height="34" rx="1.5"/>
      <circle cx="946" cy="263" r="5"/>
      <rect x="1031.5" y="269" width="3" height="34" rx="1.5"/>
      <circle cx="1033" cy="305" r="5"/>
    </g>
    <text x="1041" y="290">once we saw the data.</text>
  </g>
  <rect x="784" y="318" width="560" height="11" rx="5.5" fill="#E8ECF3"/>
  <rect x="784" y="340" width="600" height="11" rx="5.5" fill="#E8ECF3"/>
  <rect x="784" y="362" width="520" height="11" rx="5.5" fill="#E8ECF3"/>
  <rect x="784" y="384" width="580" height="11" rx="5.5" fill="#E8ECF3"/>
  <rect x="784" y="406" width="460" height="11" rx="5.5" fill="#E8ECF3"/>
  <rect x="784" y="440" width="590" height="11" rx="5.5" fill="#E8ECF3"/>
  <rect x="784" y="462" width="540" height="11" rx="5.5" fill="#E8ECF3"/>
  <rect x="784" y="484" width="600" height="11" rx="5.5" fill="#E8ECF3"/>
  <rect x="784" y="506" width="380" height="11" rx="5.5" fill="#E8ECF3"/>

  <!-- translation bubble -->
  <g filter="url(#shadow-bubble)">
    <path fill="#FFFFFF" stroke="#E5E7EF" d="M876 336a14 14 0 0 1 14-14h90l10-10 10 10h218a14 14 0 0 1 14 14v182a14 14 0 0 1-14 14H890a14 14 0 0 1-14-14z"/>
  </g>
  <g font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif">
    <!-- header -->
    <g transform="translate(896 340) scale(.140625)"><use href="#mark"/></g>
    <text x="924" y="353" font-size="13" font-weight="600" fill="#94A3B8">English  →  Vietnamese</text>
    <g transform="translate(1180 340)" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round">
      <path d="M13 5 5 13M5 5l8 8"/>
    </g>
    <!-- word + actions -->
    <text x="896" y="394" font-size="27" font-weight="700" fill="#0F172A">obvious</text>
    <text x="896" y="418" font-size="16" fill="#94A3B8">/ˈɒbviəs/</text>
    <!-- speaker + star (Lucide, ISC) -->
    <g transform="translate(1124 374)" fill="none" stroke="#4F46E5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
      <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
      <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
    </g>
    <g transform="translate(1166 374)" fill="#F59E0B" stroke="#F59E0B" stroke-width="2" stroke-linejoin="round">
      <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>
    </g>
    <!-- translation -->
    <text x="896" y="462" font-size="34" font-weight="700" fill="#4F46E5">hiển nhiên</text>
    <line x1="896" y1="480" x2="1192" y2="480" stroke="#E5E7EF"/>
    <rect x="896" y="493" width="78" height="22" rx="11" fill="#EEF2FF"/>
    <text x="935" y="508" font-size="11" font-weight="700" fill="#4F46E5" text-anchor="middle" letter-spacing=".6">ADJECTIVE</text>
    <text x="984" y="509" font-size="15" fill="#475569">rõ ràng · hiển nhiên · rành rành</text>
  </g>
</svg>
